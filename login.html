<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresa · Belaw Ec</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0D0D0D;
      color: #F0EBE1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: #141414;
      border: 1px solid rgba(184, 145, 58, 0.3);
      border-radius: 8px;
      padding: 50px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 12px 48px rgba(0,0,0,.55);
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }
    .logo-sq {
      width: 40px;
      height: 40px;
      border: 1.5px solid #B8913A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #B8913A;
      font-size: 1.1rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 0.75rem;
      color: #B8913A;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.06em;
    }
    input {
      width: 100%;
      padding: 12px;
      background: #0D0D0D;
      border: 1px solid rgba(184, 145, 58, 0.3);
      color: #F0EBE1;
      border-radius: 4px;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #B8913A;
      outline: none;
      background: #111111;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #B8913A;
      color: #0D0D0D;
      border: none;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      margin-top: 20px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transition: background 0.2s;
    }
    button:hover { background: #CDA94A; }
    button:disabled { background: #9A9388; cursor: not-allowed; }
    .msg {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
      font-size: 0.9rem;
    }
    .error {
      background: rgba(244, 67, 54, 0.2);
      color: #F44336;
      border: 1px solid rgba(244, 67, 54, 0.3);
    }
    .success {
      background: rgba(76, 175, 80, 0.2);
      color: #4CAF50;
      border: 1px solid rgba(76, 175, 80, 0.3);
    }
    .link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
    }
    .link a {
      color: #B8913A;
      text-decoration: none;
      transition: color 0.2s;
    }
    .link a:hover { color: #CDA94A; }
  </style>
</head>
<body>

<div class="box">
  <div class="logo">
    <div class="logo-sq">⚖️</div>
    <h1>Belaw Ec</h1>
  </div>

  <div class="msg error" id="err"></div>
  <div class="msg success" id="ok"></div>

  <form onsubmit="login(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required placeholder="tu@email.com">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="pass" required placeholder="••••••••">
    </div>
    <button type="submit" id="btn">Ingresar</button>
  </form>

  <div class="link">
    <a href="/">← Volver al sitio</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCjJShDdCD1NMDZQeY-7cCBVjm0eswrwnw",
    authDomain: "belaw-ec.firebaseapp.com",
    projectId: "belaw-ec",
    storageBucket: "belaw-ec.firebasestorage.app",
    messagingSenderId: "1044526877103",
    appId: "1:1044526877103:web:9a88172d082953c5bd475a"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Check if already logged in
  auth.onAuthStateChanged(user => {
    if (user) {
      window.location.href = '/app';
    }
  });

  async function login(e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    const ok = document.getElementById('ok');

    err.style.display = 'none';
    ok.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try {
      const result = await auth.signInWithEmailAndPassword(email, pass);

      if (result.user) {
        ok.textContent = '✅ Ingreso exitoso. Redirigiendo al dashboard...';
        ok.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/app';
        }, 1500);
      }
    } catch (error) {
      console.error('Login error:', error);

      let message = 'Error al iniciar sesión';
      if (error.code === 'auth/user-not-found') {
        message = 'Usuario no encontrado';
      } else if (error.code === 'auth/wrong-password') {
        message = 'Contraseña incorrecta';
      } else if (error.code === 'auth/invalid-email') {
        message = 'Email inválido';
      }

      err.textContent = message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Ingresar';
    }
  }
</script>

</body>
</html>
